name: .NET CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore GafiFish.sln

      - name: Build
        run: dotnet build GafiFish.sln --configuration Release --no-restore

      - name: Test
        shell: pwsh
        run: |
          $projects = @(
            "tests/GafiFish.Core.Tests/GafiFish.Core.Tests.csproj",
            "tests/GafiFish.Vision.Tests/GafiFish.Vision.Tests.csproj",
            "tests/GafiFish.Data.Tests/GafiFish.Data.Tests.csproj",
            "tests/GafiFish.App.Tests/GafiFish.App.Tests.csproj",
            "tests/GafiFish.Ocr.Tests/GafiFish.Ocr.Tests.csproj"
          )
          foreach ($project in $projects) {
            dotnet run --project $project --configuration Release --no-build --no-restore
            if ($LASTEXITCODE -ne 0) {
              throw "Tests failed for $project (exit code $LASTEXITCODE)."
            }
          }

      - name: Publish Windows x64 app
        run: dotnet publish src/GafiFish.App/GafiFish.App.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true --output artifacts/publish

      - name: Package Windows x64 app
        run: Compress-Archive -Path artifacts/publish/* -DestinationPath artifacts/GafiFish-win-x64.zip -Force

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: GafiFish-win-x64
          path: artifacts/GafiFish-win-x64.zip
          if-no-files-found: error
          retention-days: 14
